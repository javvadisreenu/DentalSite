<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Before Dental Treatment Sample">
  <defs>
    <linearGradient id="baBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="lipG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#9F1239"/>
    </linearGradient>
    <linearGradient id="toothBef" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#baBg1)"/>
  
  <!-- Subtle background medical grid pattern -->
  <circle cx="300" cy="200" r="180" fill="#0F766E" opacity="0.05"/>

  <!-- Mouth Outer Silhouette -->
  <g filter="url(#shadow)">
    <!-- Upper Lip -->
    <path d="M120 180 Q210 135 300 150 Q390 135 480 180 Q390 160 300 170 Q210 160 120 180 Z" fill="url(#lipG)"/>
    <!-- Lower Lip -->
    <path d="M120 180 Q210 270 300 270 Q390 270 480 180 Q390 240 300 240 Q210 240 120 180 Z" fill="#9F1239"/>

    <!-- Dark Oral Cavity Interior -->
    <path d="M140 180 Q220 165 300 172 Q380 165 460 180 Q380 235 300 235 Q220 235 140 180 Z" fill="#1C1917"/>

    <!-- Upper Teeth (Before: Misaligned, Discolored & Chipped) -->
    <g fill="url(#toothBef)" stroke="#B45309" stroke-width="1.5">
      <!-- Central Left Tooth (Chipped/Worn) -->
      <path d="M262 172 L294 172 L292 208 L265 204 Z"/>
      <!-- Central Right Tooth (Misaligned/Overlap) -->
      <path d="M296 172 L332 172 L335 210 L300 212 Z"/>
      <!-- Lateral Left Tooth -->
      <path d="M228 174 L260 172 L262 200 L234 196 Z"/>
      <!-- Lateral Right Tooth -->
      <path d="M334 172 L368 174 L362 202 L336 206 Z"/>
      <!-- Canine Left -->
      <path d="M195 177 L226 174 L227 195 L202 190 Z"/>
      <!-- Canine Right -->
      <path d="M370 174 L400 177 L394 190 L368 196 Z"/>
    </g>

    <!-- Lower Teeth (Before) -->
    <g fill="#FDE047" opacity="0.8" stroke="#92400E" stroke-width="1">
      <rect x="250" y="215" width="22" height="18" rx="2"/>
      <rect x="274" y="216" width="24" height="17" rx="2"/>
      <rect x="300" y="216" width="24" height="17" rx="2"/>
      <rect x="326" y="215" width="22" height="18" rx="2"/>
    </g>
  </g>

  <!-- Floating Badge: BEFORE -->
  <rect x="24" y="24" width="160" height="36" rx="18" fill="#DC2626" filter="url(#shadow)"/>
  <circle cx="44" cy="42" r="6" fill="#FFFFFF"/>
  <text x="60" y="47" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" letter-spacing="1">BEFORE</text>
  
  <text x="24" y="375" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#94A3B8">Case 1: Discolored &amp; Severely Misaligned Teeth</text>
</svg>